<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300"
     role="img" aria-label="THE KEEP. What is learned here is kept.">
  <title>THE KEEP</title>
  <!--
    The lockup, for the top of the readme. It carries its own near-black
    ground so it reads the same whether the reader has GitHub in light mode or
    dark, and it uses the page's own type and palette rather than inventing a
    second identity for the repository.
  -->
  <rect width="1200" height="300" fill="#0b0c0d" />

  <!-- the mark -->
  <g transform="translate(96 98)">
    <rect x="0" y="0" width="84" height="84" fill="none" stroke="#f0ede8" stroke-width="5" />
    <rect x="18" y="20" width="48" height="5" fill="#e0873a" />
    <rect x="18" y="39" width="48" height="5" fill="#f0ede8" />
    <rect x="18" y="58" width="48" height="5" fill="#f0ede8" />
  </g>

  <!-- the wordmark, letterspaced by hand so no font has to be embedded -->
  <text x="228" y="163" fill="#f0ede8"
        font-family="'Inter Tight','Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="76" font-weight="700" letter-spacing="26">THE KEEP</text>

  <text x="232" y="212" fill="#7c8285"
        font-family="'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace"
        font-size="20" font-weight="500" letter-spacing="7">WHAT IS LEARNED HERE IS KEPT</text>

  <!-- a hairline, the page's one structural device -->
  <rect x="228" y="242" width="876" height="1" fill="#f0ede8" fill-opacity="0.16" />
  <text x="228" y="274" fill="#7c8285"
        font-family="'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace"
        font-size="17" font-weight="400" letter-spacing="4">FICTIONAL CONCEPT / PORTFOLIO DEMONSTRATION</text>
</svg>
